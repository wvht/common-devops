name: 'Deploy Blazor App To Azure'
on:
  workflow_call:
    inputs:
      PACKAGE_PATH: # the path to your web app project
        type: string
        description:  'the path to your web app project, defaults to the repository root'
        required: false
        default: '.'
      DOTNET_VERSION: 
        type: string
        description: 'the dotnet version to use'
        required: false
        default: '8.0.x' 
      BUILD_CONFIGURATION: 
        type: string
        description: 'the build configuration - defaults to Release'
        required: false
        default: 'Release' 
      APP_BUILD_FILE: # the blazor app project file to build.
        type: string
        required: true
        description: 'the blazor app project file to build'
      API_BUILD_FILE: # the api project file to build.
        type: string
        required: false
        description: 'the api project file to build'
      ENVIRONMENT: # the name of the environment that the deployment relates to.
        type: string
        required: true
        description: 'The name of the environment that the deployment relates to'
      BLAZOR_ENVIRONMENT: # the name of the blazor environment that the deployment relates to.
        type: string
        required: true
        description: 'The name of the blazor environment that the deployment relates to'
      MODULE_NAME: # the name of the module being deployed.
        type: string
        required: true
        description: 'the name of the azure app to deploy to.'
      APP_FILTER: # 
        type: string
        required: false
        description: 'the file filter that detects if the app has changed'
        default: './*App/**'
      API_FILTER: # 
        type: string
        required: false
        description: 'the file filter that detects if the api has changed'
        default: './*Api/**'
      INFRASTUCTURE_FILTER: # 
        type: string
        required: false
        description: 'the file filter that detects if the infrastructure has changed'
        default: 'terraform/**'
      LOCATION:
        type: string
        required: false
        description: 'the name of the azure location being deployed to'
        default: ${{ vars.AZURE_LOCATION }}
      LOCATION_SHORT:
        type: string
        required: false
        description: 'the short name of the azure location being deployed to'
        default: ${{ vars.AZURE_LOCATION_SHORT }}
    secrets:
      AZURE_PUBLISH_SECRET:
        required: true
      TF_API_TOKEN:
        required: true

env:
  WEB_APP_NAME: 'app-wvht-${{ inputs.MODULE_NAME }}-spa-${{ inputs.ENVIRONMENT }}-${{ inputs.LOCATION_SHORT }}-001'
  FUNCTION_APP_NAME: 'func-wvht-${{ inputs.MODULE_NAME }}-api-${{ inputs.ENVIRONMENT }}-${{ inputs.LOCATION_SHORT }}-01'
jobs:

  # JOB to run change detection
  changes:
    name: 'Detect Changes'
    runs-on: ubuntu-privatenetworking
    # Required permissions
    environment: ${{ inputs.ENVIRONMENT }}
    # Set job outputs to values from filter step
    outputs:
      app: ${{ steps.filter.outputs.app }}
      api: ${{ steps.filter.outputs.api}}
      infrastructure: ${{ steps.filter.outputs.infrastructure}}
    # Use the Bash shell regardless whether the GitHub Actions runner is ubuntu-latest, macos-latest, or windows-latest
    defaults:
      run:
        shell: bash

    steps:
    # Checkout the repository to the GitHub Actions runner
    - name: Checkout
      uses: actions/checkout@v4

    - name: Check Path
      uses: dorny/paths-filter@v3
      id: filter
      with:
        base: ${{ github.ref }}
        filters: |
          infrastructure:
            - ${{ inputs.INFRASTUCTURE_FILTER }}
          app:
            - ${{ inputs.APP_FILTER }}
          api:
            - ${{ inputs.API_FILTER }}

  build-app:
    if: ${{ ((github.event_name == 'push' && needs.changes.outputs.app == 'true') || github.event_name == 'workflow_dispatch' ) && always() && !failure() }}
    name: Build App
    runs-on: ubuntu-privatenetworking
    needs: [changes]
    env:
      DOTNET_ROOT:

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.DOTNET_VERSION }}
      
      - name: Set up dependency caching for faster builds
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build with dotnet
        run: dotnet build '${{ inputs.APP_BUILD_FILE }}' --configuration ${{ inputs.BUILD_CONFIGURATION }}

      - name: dotnet publish 
        run: dotnet publish '${{ inputs.APP_BUILD_FILE }}' -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Move environment config file over web config file.
        run: cp ${{env.DOTNET_ROOT}}/myapp/web.${{ inputs.BLAZOR_ENVIRONMENT }}.config ${{env.DOTNET_ROOT}}/myapp/web.config

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy-app:
    if: ${{ ((github.event_name == 'push' && needs.changes.outputs.app == 'true') || github.event_name == 'workflow_dispatch' ) && always() && !failure() }}
    name: Deploy App
    runs-on: ubuntu-privatenetworking
    needs: [build-app, changes]
    environment: ${{ inputs.ENVIRONMENT }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_PUBLISH_SECRET }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.WEB_APP_NAME }}
          package: ${{ inputs.PACKAGE_PATH }}

      - name: Set .NET Version in Azure App Service
        run: |
          az webapp config set --resource-group wvh${{ inputs.ENVIRONMENT }}-rg-serverless-apps --name ${{ env.WEB_APP_NAME }} --net-framework-version "v8.0"

  deploy-api:
    if: ${{ ((github.event_name == 'push' && needs.changes.outputs.api == 'true') || github.event_name == 'workflow_dispatch' ) && always() && !failure() }}
    name: Deploy Api
    runs-on: ubuntu-privatenetworking
    needs: [changes]
    environment: ${{ inputs.ENVIRONMENT }}
    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4

      - name: Setup DotNet ${{ inputs.DOTNET_VERSION }} Environment
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.DOTNET_VERSION }}

      - name: 'Resolve Project Dependencies Using Dotnet'
        shell: bash
        run: |
          pushd './${{ inputs.PACKAGE_PATH }}'
          dotnet build ${{ inputs.API_BUILD_FILE }} --configuration Release --output ./output
          popd
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_PUBLISH_SECRET }}

      - name: 'Run Azure Functions Action'
        uses: Azure/functions-action@v1
        id: fa
        with:
          app-name: '${{ env.FUNCTION_APP_NAME }}'
          slot-name: 'production'
          package: '${{ inputs.PACKAGE_PATH }}/output'

